name: FPL Copycat

on:
  schedule:
    # Fires hourly, but copycat.py's should_run_now() gate makes almost every run a
    # no-op. Real work happens only at 21:00/22:00 UTC - ahead of the FPL price
    # change, which for 2026/27 moved to MIDNIGHT UK time (23:00 UTC under BST,
    # 00:00 UTC under GMT; the old 01:30 GMT / 02:30 BST rule is gone) - and in the
    # 6h before a gameweek deadline, so deadline-day moves aren't missed. Two price
    # slots, not one, because GitHub routinely delays and sometimes drops schedules.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (1 = don't submit anything)"
        default: "0"
      check_pat:
        description: "Only probe whether GH_PAT can write Actions variables (1 = yes)"
        default: "0"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: copycat
  cancel-in-progress: false

jobs:
  copycat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Run copycat
        env:
          FIX_COOKIE: ${{ secrets.FIX_COOKIE }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          # PAT with Variables: read/write - GITHUB_TOKEN cannot write Actions variables
          GH_PAT: ${{ secrets.GH_PAT }}
          FPL_COOKIE: ${{ secrets.FPL_COOKIE }}
          FPL_ENTRY: ${{ secrets.FPL_ENTRY }}
          TARGET_MANAGER: "Tom Dollimore"
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          CHECK_PAT: ${{ github.event.inputs.check_pat || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python copycat.py

      - name: Persist state
        if: always()
        run: |
          git config user.name "fpl-copycat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json || true
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push || true
