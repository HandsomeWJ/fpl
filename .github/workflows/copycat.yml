name: FPL Copycat

on:
  schedule:
    # Fires every 15 min, but copycat.py's should_run_now() gate makes almost every
    # run a no-op. Real work happens only in the 150min before the FPL price change
    # and in the 6h before a gameweek deadline. In the owner's clock (SGT):
    #   summer  price change 07:00 SGT -> work 04:37..06:52 SGT
    #   winter  price change 08:00 SGT -> work 05:37..07:52 SGT
    # For 2026/27 prices move at MIDNIGHT UK time (the old 01:30 GMT / 02:30 BST
    # rule is gone); the gate computes that from Europe/London so it tracks DST.
    #
    # NOT on the hour: GitHub delays scheduled runs under load and :00 is peak
    # congestion. Measured on this repo - "0 * * * *" delivered 13% of firings and
    # dropped EVERY slot in the GW2 deadline window; "*/15" delivered ~54%. Firing
    # often at off-peak minutes is the only defence, and the gate keeps it cheap
    # (a skipped run is one unauthenticated GET, no token rotation spent).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (1 = don't submit anything)"
        default: "0"
      check_pat:
        description: "Only probe whether GH_PAT can write Actions variables (1 = yes)"
        default: "0"
      debug:
        description: "Verbose diagnostics: live squad, name resolution, payload (1 = yes)"
        default: "0"
      allow_transfer_chip:
        description: "Permit spending WC/FH on a partial mirror (1 = yes). Normally 0."
        default: "0"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: copycat
  cancel-in-progress: false

jobs:
  copycat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Run copycat
        env:
          FIX_COOKIE: ${{ secrets.FIX_COOKIE }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          # PAT with Variables: read/write - GITHUB_TOKEN cannot write Actions variables
          GH_PAT: ${{ secrets.GH_PAT }}
          FPL_COOKIE: ${{ secrets.FPL_COOKIE }}
          FPL_ENTRY: ${{ secrets.FPL_ENTRY }}
          TARGET_MANAGER: "Tom Dollimore"
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          CHECK_PAT: ${{ github.event.inputs.check_pat || '0' }}
          DEBUG: ${{ github.event.inputs.debug || '0' }}
          ALLOW_TRANSFER_CHIP: ${{ github.event.inputs.allow_transfer_chip || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python copycat.py

      - name: Persist state
        if: always()
        # Must NOT swallow failures. state/state.json is the transfer dedup record;
        # losing it silently makes a later run report an already-mirrored transfer as
        # "I don't own X". Nearly every push failure here is a race with a concurrent
        # commit, so retry - but if it genuinely can't be saved, fail red rather than
        # report a green run that saved nothing.
        run: |
          set -euo pipefail
          git config user.name "fpl-copycat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then
            echo "state unchanged; nothing to persist"
            exit 0
          fi
          git commit -m "update state [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              echo "state persisted on attempt $i"
              exit 0
            fi
            echo "persist attempt $i failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::state/state.json could not be pushed - transfer dedup state is lost"
          exit 1
