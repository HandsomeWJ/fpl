name: FPL Copycat

on:
  # schedule: DISABLED 2026-10-11 (switch-over) - Dugout (fpl-dugout on Railway) is the
  # executor now and the cron-job.org dispatcher is off. workflow_dispatch stays for
  # manual runs; its dry_run default is 1 so a stray dispatch cannot submit while Dugout
  # is live. Never run both executors live: double transfers cost real hits.
  # The old fallback cron was "7,22,37,52 * * * *" (why those minutes: CLAUDE.md, Scheduler).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (1 = don't submit anything). Default 1 since the switch-over: pass 0 only if Dugout is NOT executing"
        default: "1"
      check_pat:
        description: "Only probe whether GH_PAT can write Actions variables (1 = yes)"
        default: "0"
      debug:
        description: "Verbose diagnostics: live squad, name resolution, payload (1 = yes)"
        default: "0"
      allow_transfer_chip:
        description: "Permit spending WC/FH on a partial mirror (1 = yes). Normally 0."
        default: "0"
      dump_reveal:
        description: "Only dump the reveal page structure and exit (1 = yes)"
        default: "0"
      allow_hits:
        description: "Permit -4 point hits (1 = yes). Owner decision 2026-09-12: ON by default on the test account so transfers land before the price change. Pass 0 to suppress."
        default: "1"
      hold_latest:
        description: "Exclude the target's N most recent transfers from the target squad"
        default: "0"
      allow_downgrade:
        description: "APPLY the suggested enabling downgrade (1 = yes). Default 0 = recommend only: the run reports the downgrade that would fund an unaffordable transfer; dispatch with 1 to approve it."
        default: "0"
      scheduled:
        description: "Set by the external scheduler: behave like cron (gated). Leave 0 for a manual run."
        default: "0"
      snapshot_force:
        description: "Take a price snapshot now even outside the pre/post-midnight-UK windows (1 = yes)"
        default: "0"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: copycat
  cancel-in-progress: false

jobs:
  copycat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Run copycat
        env:
          FIX_COOKIE: ${{ secrets.FIX_COOKIE }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          # PAT with Variables: read/write - GITHUB_TOKEN cannot write Actions variables
          GH_PAT: ${{ secrets.GH_PAT }}
          FPL_COOKIE: ${{ secrets.FPL_COOKIE }}
          FPL_ENTRY: ${{ secrets.FPL_ENTRY }}
          TARGET_MANAGER: "Tom Dollimore"
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          CHECK_PAT: ${{ github.event.inputs.check_pat || '0' }}
          DEBUG: ${{ github.event.inputs.debug || '0' }}
          ALLOW_TRANSFER_CHIP: ${{ github.event.inputs.allow_transfer_chip || '0' }}
          DUMP_REVEAL: ${{ github.event.inputs.dump_reveal || '0' }}
          ALLOW_HITS: ${{ github.event.inputs.allow_hits || '1' }}
          HOLD_LATEST_TRANSFERS: ${{ github.event.inputs.hold_latest || '0' }}
          ALLOW_DOWNGRADE: ${{ github.event.inputs.allow_downgrade || '0' }}
          SCHEDULED: ${{ github.event.inputs.scheduled || '0' }}
          SNAPSHOT_FORCE: ${{ github.event.inputs.snapshot_force || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python copycat.py

      - name: Persist state and price snapshots
        if: always()
        # Must NOT swallow failures. state/state.json is the transfer dedup record;
        # losing it silently makes a later run report an already-mirrored transfer as
        # "I don't own X". Nearly every push failure here is a race with a concurrent
        # commit, so retry - but if it genuinely can't be saved, fail red rather than
        # report a green run that saved nothing.
        run: |
          set -euo pipefail
          git config user.name "fpl-copycat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          [ -d data/prices ] && git add data/prices
          [ -d data/preview ] && git add data/preview
          [ -d data/ledger ] && git add data/ledger
          if git diff --cached --quiet; then
            echo "state unchanged; nothing to persist"
            exit 0
          fi
          git commit -m "update state / snapshots / records [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              echo "state persisted on attempt $i"
              exit 0
            fi
            echo "persist attempt $i failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::state/state.json could not be pushed - transfer dedup state is lost"
          exit 1
