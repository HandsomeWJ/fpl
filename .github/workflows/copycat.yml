name: FPL Copycat

on:
  schedule:
    # Fires hourly (plus :45), but copycat.py's should_run_now() gate makes almost
    # every run a no-op. Real work happens only in the 150min before the FPL price
    # change and in the 6h before a gameweek deadline. Owner's clock is SGT:
    #   summer  price change 07:00 SGT -> runs 05:00, 06:00, 06:45 SGT
    #   winter  price change 08:00 SGT -> runs 06:00, 06:45, 07:00, 07:45 SGT
    # For 2026/27 prices move at MIDNIGHT UK time (the old 01:30 GMT / 02:30 BST
    # rule is gone); the gate computes that from Europe/London so it tracks DST.
    # Several slots, not one, because GitHub delays and sometimes drops schedules.
    - cron: "0 * * * *"
    # :45 slots put the LAST run ~15min before the change under BST and under GMT.
    - cron: "45 22,23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (1 = don't submit anything)"
        default: "0"
      check_pat:
        description: "Only probe whether GH_PAT can write Actions variables (1 = yes)"
        default: "0"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: copycat
  cancel-in-progress: false

jobs:
  copycat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Run copycat
        env:
          FIX_COOKIE: ${{ secrets.FIX_COOKIE }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          # PAT with Variables: read/write - GITHUB_TOKEN cannot write Actions variables
          GH_PAT: ${{ secrets.GH_PAT }}
          FPL_COOKIE: ${{ secrets.FPL_COOKIE }}
          FPL_ENTRY: ${{ secrets.FPL_ENTRY }}
          TARGET_MANAGER: "Tom Dollimore"
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          CHECK_PAT: ${{ github.event.inputs.check_pat || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python copycat.py

      - name: Persist state
        if: always()
        run: |
          git config user.name "fpl-copycat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json || true
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push || true
