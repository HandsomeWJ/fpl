[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copycat-core"
version = "0.3.0"
description = "Mirror a target FPL manager's squad, lineup and chips onto your team - the logic behind HandsomeWJ/fpl"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12"]

[tool.setuptools]
packages = ["copycat_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
